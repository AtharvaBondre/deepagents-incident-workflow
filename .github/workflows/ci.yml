name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned code-quality tooling
        run: python -m pip install --disable-pip-version-check ruff==0.12.12

      - name: Bootstrap digest-pinned sandbox image
        run: ./scripts/bootstrap-pinned-images.sh sandbox

      - name: Compile Python sources
        run: python -m compileall -q scripts tests fixtures verifiers integration

      - name: Validate public surface
        run: python scripts/check-public-surface.py

      - name: Validate qualified dependency evidence offline
        run: |
          python -I scripts/dependency_qualification.py
          python -I scripts/typescript_dependency_qualification.py

      - name: Validate prerequisites and inspect effective policy
        run: |
          ./scripts/run-local.sh preflight
          ./scripts/run-local.sh dump-policy

      - name: Run pinned lint and formatting checks
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Run controller tests
        run: ./scripts/run-local.sh test

      - name: Run deterministic retry workflow
        run: |
          ./scripts/run-local.sh run \
            --scenario retry-success \
            --budget-seconds 120 \
            --max-attempts 2
          ./scripts/run-local.sh verify --latest

      - name: Check working tree formatting
        run: git diff --check

  deepagents-sdk-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the hash-locked optional SDK
        env:
          PYTHON_BIN: python
        run: ./scripts/install-deepagents-runtime.sh

      - name: Bootstrap digest-pinned sandbox image
        run: ./scripts/bootstrap-pinned-images.sh sandbox

      - name: Validate the pinned SDK and bounded worker path
        run: |
          ./scripts/run-local.sh preflight \
            --require-deepagents \
            --deepagents-python .deepagents-runtime/bin/python
          .deepagents-runtime/bin/python scripts/deepagents_sdk_smoke.py
          .deepagents-runtime/bin/python scripts/deepagents_e2e_smoke.py \
            --python .deepagents-runtime/bin/python

  network-isolated-sdk-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up qualified Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Bootstrap digest-pinned sandbox image
        run: ./scripts/bootstrap-pinned-images.sh sandbox

      - name: Build the locked SDK and prove runtime network isolation
        run: ./scripts/run-network-isolated-sdk-smoke.sh

  deepagents-typescript-sdk-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up qualified Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up qualified Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: typescript-runtime/package-lock.json

      - name: Install and validate the locked TypeScript SDK
        run: |
          python3 -I scripts/typescript_dependency_qualification.py
          ./scripts/install-deepagents-typescript-runtime.sh
          node --test .deepagents-typescript-runtime/dist/deepagents_worker.test.js

      - name: Bootstrap digest-pinned candidate image
        run: ./scripts/bootstrap-pinned-images.sh sandbox

      - name: Validate the TypeScript worker and controller path
        run: |
          ./scripts/run-local.sh preflight \
            --require-deepagents \
            --deepagents-language typescript \
            --deepagents-node node
          node .deepagents-typescript-runtime/dist/deepagents_sdk_smoke.js
          python3 scripts/deepagents_e2e_smoke.py \
            --language typescript \
            --node node

  network-isolated-typescript-sdk-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up qualified Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Bootstrap digest-pinned sandbox images
        run: ./scripts/bootstrap-pinned-images.sh sandbox

      - name: Build the locked TypeScript SDK and prove network isolation
        run: ./scripts/run-network-isolated-typescript-sdk-smoke.sh
