[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepagents-incident-workflow"
version = "0.1.0"
description = "A local-first reference workflow for bounded AI incident remediation with Deep Agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Deep Agents Incident Workflow contributors" }
]
keywords = ["ai-agents", "incident-remediation", "deepagents", "sandbox", "verification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]
dependencies = []

[project.optional-dependencies]
deepagents = [
  "deepagents==0.7.8",
  "langchain-anthropic==1.6.1",
  "langchain-google-genai==4.3.5",
  "langchain-ollama==1.1.0",
  "langchain-openai==1.6.0"
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools]
packages = []
